services:

  keycloak-db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped

    command: start

    depends_on:
      keycloak-db:
        condition: service_healthy

    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_HOSTNAME: "${PUBLIC_URL}/auth"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - app-network

  backend:
    image: jonnaskauan/sf-org-hub-sync:latest
    restart: unless-stopped

    environment:
      MY_SQL_URL: ${MY_SQL_URL}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      BOOTSTRAP_ENABLED: ${BOOTSTRAP_ENABLED}
      APP_BOOTSTRAP_NAME: ${APP_BOOTSTRAP_NAME}
      APP_BOOTSTRAP_USERNAME: ${APP_BOOTSTRAP_USERNAME}
      APP_BOOTSTRAP_PASSWORD: ${APP_BOOTSTRAP_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRATION_TIME: ${JWT_EXPIRATION_TIME}
      SFDX_ENCRYPTION_KEY: ${SFDX_ENCRYPTION_KEY}
      SERVER_PORT: ${SERVER_PORT}
    depends_on:
      - mysql

    networks:
      - app-network

  frontend:
    image: jonnaskauan/sf-org-manager:latest
    restart: unless-stopped

    ports:
      - "8080:80"
      - "443:443"
      
    volumes:
      - 

    depends_on:
      - backend

    networks:
      - app-network


volumes:
  keycloak_pgdata:
  mysql_data:


networks:
  app-network:
    driver: bridge